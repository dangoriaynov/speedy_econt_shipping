# Publish a tagged release of this plugin to WordPress.org.
#
# This plugin used to be released by hand, from the one machine that had the Subversion working copy
# and the WordPress.org password. That is why 1.16 was written in 2024 and never reached a single shop:
# the code was ready and the only machine that could ship it was not. The credentials belong in this
# repository's secrets instead, and the tag is the release decision:
#
#   git tag -a v1.15.2 -m "1.15.2" && git push origin v1.15.2
#
# This is a maintenance line, not main. main carries the unreleased 2.0.0 rewrite; releases of the
# 1.15.x series are cut from release/1.15.x and never merged into main.
#
# Required once, in repository settings -> Secrets and variables -> Actions:
#   SVN_PASSWORD   a SECRET, on the Secrets tab. Not a variable: variables are stored and shown in
#                  plain text, and are not masked in the log.
#   SVN_USERNAME   the WordPress.org login that owns the plugin. A secret or a variable, either tab -
#                  it is already printed in readme.txt under Contributors, so it is not a password.
#
# The two tabs look identical on a phone, and the first release failed on exactly that: the username
# went in as a variable, secrets.SVN_USERNAME came back empty, and Subversion refused the commit in
# twelve seconds with nothing in the annotations to say why. Hence the preflight below.
name: Release to WordPress.org

on:
  push:
    tags: ['v1.*']
  workflow_dispatch:

permissions:
  contents: read

env:
  SLUG: speedy-econt-shipping
  DEV_URL: https://dev.dobavki.club

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- The version is one number in three places; the tag is the third ---------------------------
      # A tag that disagrees with the code would publish something nobody named.
      - name: Version agrees with the tag
        run: |
          VERSION="$(grep -m1 '^ \* Version:' speedy_econt_shipping.php | awk '{print $3}')"
          STABLE="$(grep -m1 '^Stable tag:' readme.txt | awk '{print $3}')"
          TAG="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "header=$VERSION stable=$STABLE tag=$TAG"
          [ "$VERSION" = "$STABLE" ] || { echo "::error::the header and Stable tag disagree"; exit 1; }
          case "$GITHUB_REF_TYPE" in
            tag) [ "$VERSION" = "$TAG" ] || { echo "::error::tag ${GITHUB_REF_NAME} is not version ${VERSION}"; exit 1; } ;;
          esac
          grep -q "^### ${VERSION} - " readme.txt || { echo "::error::readme.txt has no changelog entry for ${VERSION}"; exit 1; }

      # --- Bulgarian, complete and compiled ----------------------------------------------------------
      # Every shop running this plugin is Bulgarian. A string added without its Bulgarian lands there in
      # English, and a catalogue compiled from an older .po is a translation WordPress never reads -
      # bin/make-pot --check answers both, by content rather than by file dates.
      - name: Translations
        run: |
          python3 bin/make-pot --check
          git diff --exit-code languages || { echo "::error::the compiled catalogues were out of date"; exit 1; }

      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.1', coverage: none }

      - name: PHP syntax
        run: for f in $(git ls-files '*.php'); do php -l "$f" >/dev/null || exit 1; done

      # --- The package, checked exactly as it will be published --------------------------------------
      # Plugin Check reads the folder it is given: checking the repository would fail the release over
      # .github and bin, which .distignore strips and which were never going to be published.
      - name: Build the package
        run: |
          DEST="${RUNNER_TEMP}/pkg/${SLUG}"
          mkdir -p "$DEST"
          rsync -a --exclude-from=.distignore ./ "$DEST/"
          (cd "${RUNNER_TEMP}/pkg" && zip -qr "${RUNNER_TEMP}/${SLUG}-${VERSION}.zip" "${SLUG}")
          echo "ZIP=${RUNNER_TEMP}/${SLUG}-${VERSION}.zip" >> "$GITHUB_ENV"
          echo "package:"; find "$DEST" -type f | sed "s|${RUNNER_TEMP}/pkg/||" | sort

      # --- Plugin Check, on the code that is about to ship -------------------------------------------
      # Not the checkout: .github and bin are findings against the repository and were never going to
      # be published. The package is what the directory gets.
      #
      # And not "zero errors" either. This plugin went to the directory in 2024 with 157 of them -
      # unescaped output, direct queries, a text domain with underscores that cannot be renamed without
      # orphaning every translation anyone made - and a gate nobody can pass is not a gate. The codes
      # below are exactly that inheritance, listed so that anything NEW still stops the release.
      # plugin-check-baseline.json and bin/plugin-check-gate.py hold the same list per file, for
      # running the check by hand against a real site.
      #
      # One of them deserves naming out loud: OffloadedContent is js.php pulling jQuery from
      # code.jquery.com on the cart and checkout, and only when the shop switched that option on. It
      # sends a customer's address to a CDN that has no business in the checkout. It is not fixed here
      # because the option exists precisely to work around a theme that breaks otherwise, and a
      # farewell release is the wrong place to find out whose. The successor does not do it at all.
      - name: Plugin Check, on the code that is about to ship
        uses: wordpress/plugin-check-action@v1.1.9
        with:
          build-dir: ${{ runner.temp }}/pkg/speedy-econt-shipping
          ignore-warnings: true
          ignore-codes: |
            PluginCheck.CodeAnalysis.Offloading.OffloadedContent
            PluginCheck.Security.DirectDB.UnescapedDBParameter
            WordPress.DB.PreparedSQL.NotPrepared
            WordPress.DB.RestrictedFunctions.mysql_mysqli_more_results
            WordPress.DB.RestrictedFunctions.mysql_mysqli_multi_query
            WordPress.DB.RestrictedFunctions.mysql_mysqli_next_result
            WordPress.Security.EscapeOutput.OutputNotEscaped
            WordPress.Security.EscapeOutput.UnsafePrintingFunction
            WordPress.WP.I18n.MissingArgDomain
            WordPress.WP.I18n.NonSingularStringLiteralText
            WordPress.WP.I18n.TextDomainMismatch
            textdomain_invalid_format

      # --- The dev site must already be running this build -------------------------------------------
      # SVN last, dev-verified builds only. Read from the readme the dev site actually serves.
      - name: Dev is on this version
        run: |
          DEV="$(curl -sS -m 20 -L -A 'sesh release-ci' "${DEV_URL%/}/wp-content/plugins/${SLUG}/readme.txt" \
                 | grep -i '^Stable tag:' | head -1 | awk '{print $3}' | tr -d '\r')"
          echo "dev (${DEV_URL}) is on ${DEV:-unknown}, this is ${VERSION}"
          [ "$DEV" = "$VERSION" ] || { echo "::error::deploy ${VERSION} to dev first"; exit 1; }

      # --- The credentials are there at all ----------------------------------------------------------
      # Said as an ::error::, which is readable from outside the run: whoever cuts the tag does not
      # necessarily have access to the logs.
      - name: Credentials
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME || vars.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        run: |
          MISSING=
          [ -n "$SVN_USERNAME" ] || MISSING="SVN_USERNAME (secret or variable)"
          [ -n "$SVN_PASSWORD" ] || MISSING="${MISSING:+$MISSING and }SVN_PASSWORD (must be a SECRET, not a variable)"
          if [ -n "$MISSING" ]; then
            echo "::error::WordPress.org credentials are missing: ${MISSING}. Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "username ${#SVN_USERNAME} characters, password ${#SVN_PASSWORD} characters - both present"

      - name: Publish
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME || vars.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: speedy-econt-shipping

      # --- Did it actually arrive ---------------------------------------------------------------------
      # The directory takes a few minutes to serve a new tag. Not a failure if it has not yet, but worth
      # saying: "committed" and "served" are not the same thing.
      - name: The directory serves it
        run: |
          for i in 1 2 3 4 5 6; do
            GOT="$(curl -sS -m 20 "https://api.wordpress.org/plugins/info/1.0/${SLUG}.json" \
                   | python3 -c 'import json,sys; print(json.load(sys.stdin).get("version",""))' 2>/dev/null || true)"
            [ "$GOT" = "$VERSION" ] && { echo "the directory serves ${VERSION}"; exit 0; }
            echo "directory still on ${GOT:-?} (try $i)"; sleep 30
          done
          echo "::warning::committed, but the directory still serves an older version - check in a few minutes"
